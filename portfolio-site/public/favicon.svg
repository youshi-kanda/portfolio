<!--
  The register's row marker at favicon scale.

  Not a new mark: `.reg .r .no .sq` is a solid square in the signal pigment on
  the bone-paper ground, and it is already the element that stands at the head
  of every row in the work index. The two colours are `--paper` (#F4F2ED) and
  the default `--sig` (#14654A) from tokens.css, written as literals because a
  favicon is fetched as its own document and never sees the stylesheet.

  Nothing was designed here; the art direction is untouched.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <rect width="32" height="32" fill="#F4F2ED"/>
  <rect x="8" y="8" width="16" height="16" fill="#14654A"/>
</svg>
