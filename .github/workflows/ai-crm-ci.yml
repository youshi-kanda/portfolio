name: AI CRM CI

on:
  push:
    branches: [main]
    paths:
      - 'ai-crm-demo/**'
      - '.github/workflows/ai-crm-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'ai-crm-demo/**'
      - '.github/workflows/ai-crm-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-tests:
    name: Backend tests (pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-crm-demo/backend
    env:
      # Deterministic stub AI provider. No external AI API is contacted in CI.
      AI_PROVIDER: mock
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ai-crm-demo/backend/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # pytest.ini pins DJANGO_SETTINGS_MODULE=config.settings.test,
      # which uses SQLite in-memory — no PostgreSQL service is needed.
      - name: Run pytest
        run: python -m pytest

  frontend-checks:
    name: Frontend checks (lint / type-check / build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-crm-demo/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: ai-crm-demo/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Build
        run: npm run build
