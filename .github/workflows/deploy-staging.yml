name: Deploy Portfolio Staging

on:
  push:
    branches:
      - develop
    paths:
      - "portfolio-site/**"
      - ".github/workflows/deploy-staging.yml"
      - ".github/scripts/staging-smoke.sh"
  workflow_dispatch:

permissions:
  contents: read

# Staging is a credentialed review environment, not a second public site
# (Issue #36). The origin is named once, here, so the deploy and the smoke
# cannot disagree about which host is being checked.
env:
  STG_ORIGIN: https://stg-portfolio.neppepe.net

concurrency:
  group: portfolio-staging
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: portfolio-site

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: portfolio-site/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run QA
        run: npm run qa

      - name: Build
        run: npm run build

      - name: Configure SSH
        env:
          VPS_SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$VPS_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Deploy to staging
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          rsync -az --delete \
            -e "ssh -p $VPS_PORT -i ~/.ssh/id_ed25519" \
            dist/ \
            "$VPS_USER@$VPS_HOST:/var/www/portfolio-stg/"

      # The smoke lives in a script rather than inline, so the procedure a human
      # runs by hand and the procedure CI runs are the same one:
      #
      #   STG_BASIC_USER=... STG_BASIC_PASS=... bash .github/scripts/staging-smoke.sh
      #
      # It asserts the access boundary, not just reachability: with the
      # credentials configured, an anonymous request to staging must be refused
      # and an authenticated one must succeed. Both are needed — a 200 for
      # everyone is the state this Issue exists to end, and a 401 for the
      # deploy itself would mean nothing is being verified at all.
      #
      # The two secrets are passed in the environment and read from there by the
      # script into a mode-0600 netrc file. They are never on a command line, in
      # a URL, or echoed; `set -x` is not used anywhere in the script for the
      # same reason.
      #
      # Until the one-time server work in portfolio-site/DEPLOY.md §10 is done
      # and the secrets exist, both are empty and the script runs its
      # reachability checks anonymously — exactly what the previous inline
      # `curl` did — while reporting the boundary as NOT VERIFIED. Nothing about
      # today's green is weakened by this step, and nothing about it is
      # pretended either.
      - name: Staging smoke
        env:
          STG_BASIC_USER: ${{ secrets.STG_BASIC_USER }}
          STG_BASIC_PASS: ${{ secrets.STG_BASIC_PASS }}
        run: bash ../.github/scripts/staging-smoke.sh
